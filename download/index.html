  <script>
    // Phones go straight to their store. Desktop visitors see the QR code and both buttons.
    (function () {
      var APP_STORE = "https://apps.apple.com/app/id6738445061";
      var GOOGLE_PLAY = "https://play.google.com/store/search?q=RushB%20CS2&c=apps"; // TODO: replace with the app's Google Play URL
      var ua = navigator.userAgent || "";
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var params = new URLSearchParams(location.search);
      if (params.get("stay") === "1") return;
      if (isIOS) location.replace(APP_STORE);
      else if (isAndroid) location.replace(GOOGLE_PLAY);
    })();
  </script>
