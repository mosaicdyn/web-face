<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found | RushB</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <style>
    .nf { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 140px 20px 80px; text-align: center; }
    .nf__code { font-family: var(--font-display); font-size: clamp(96px, 22vw, 200px); line-height: 1; color: var(--accent); text-shadow: 0 0 60px rgba(0,255,196,.35); }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-header__logo" href="/" aria-label="RushB home"><img src="/assets/img/logo.webp" alt="RushB" width="139" height="60" /></a>
  </header>
  <main class="nf">
    <p class="nf__code">404</p>
    <h1 class="section-title">Wrong site, <span class="accent">rotate</span></h1>
    <p class="section-lead">This page doesn’t exist. Head back to the main page or download the app.</p>
    <div class="store-buttons">
      <a class="btn btn--soft" href="/">Back to home</a>
      <a class="btn btn--soft" href="/download/">Download App</a>
    </div>
  </main>

</html>
